name: Build & Test

#------------------------------------------------------------------------------------------------------------------------------------------
env:
  SOLUTION_NAME: "./ErikForwerk.TestAbstractions.v2.slnx"

#------------------------------------------------------------------------------------------------------------------------------------------
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

#------------------------------------------------------------------------------------------------------------------------------------------
jobs:
  build:
    #--- need to run on Windows because of Windows-STA tests ---
    runs-on: windows-latest

    strategy:
      matrix:
        CONFIGURATION: [Debug, Release]

    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x

    - name: Restore Solution
      run: dotnet restore $env:SOLUTION_PATH

    - name: Build Solution
      run: dotnet build $env:SOLUTION_PATH --configuration $env:Configuration --no-restore
      env:
        Configuration: ${{ matrix.CONFIGURATION }}

    - name: Run Unit Tests with Code Coverage
      run: dotnet test $env:SOLUTION_PATH --configuration $env:Configuration --no-build --settings .runsettings --collect:"XPlat Code Coverage;Format=json,cobertura"
      env:
        Configuration: ${{ matrix.CONFIGURATION }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./TestResults/**/*.cobertura.xml
        flags: unittests
